name: Public host checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public host dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate public host contract without the proprietary wheel
        run: python -m unittest discover -s host_tests -v

      - name: Check Python syntax
        run: python -m compileall -q config host_tests manage.py

