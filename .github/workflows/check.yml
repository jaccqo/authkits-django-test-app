name: Public host checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public host dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate example environment and settings import
        run: |
          cp .env.example .env
          python -c "import config.settings as s; assert s.DEBUG is True; assert '127.0.0.1' in s.ALLOWED_HOSTS"

      - name: Check Python syntax
        run: python -m compileall -q config manage.py
